# FractalBot configuration (version 2). Reference: docs/config-v2.md
# Secrets are not written here: store each one with `fractalbot secret set <name>`.
# After editing, run `fractalbot config check`, then `fractalbot reload`.

version: 2
dataDir: ~/.fractalbot          # inboxes, dedupe, polling offsets, schedule state
timezone: Asia/Shanghai

# ── Channels: how to reach each chat platform ───────────────
channels:
  feishu:
    assistant:
      appId: cli_xxxxxxxxxxxxxxxx
      appSecret: secret:feishu-assistant
      allowedUsers: [ou_xxxxxxxxxxxxxxxx]
    # domain: lark              # Lark (international); default feishu

  # Shared by the agents below: messages that name no one go to `default`.
  # Start a message with @researcher to pick an agent, /use researcher to
  # switch the conversation, /who to see who receives it.
  telegram:
    main:
      botToken: secret:telegram-main
      allowedUsers: [123456789]
      adminId: 123456789        # may run /adduser, /removeuser, /listusers
      default: assistant
      # chats: {"-100123456789": researcher}   # pin a group to one agent

  # imessage:                   # macOS only; one account per Mac
  #   main:
  #     recipient: "+8600000000000"
  #     default: assistant

  # slack:
  #   main: {botToken: secret:slack-bot, appToken: secret:slack-app}
  # discord:
  #   main: {token: secret:discord}

# Only needed when `codex` is not on the gateway's PATH.
# runtimes:
#   codexApp: {codex: ~/.local/bin/codex}
#   # Start DeepSeek Harness Desktop yourself with --remote-debugging-port=9224.
#   # This runtime submits to the currently active Harness composer over the
#   # loopback-only DevTools endpoint; Harness has no native durable queue.
#   deepseekHarness: {cdpEndpoint: http://127.0.0.1:9224}

# ── Agents: who receives messages and schedules ─────────────
agents:
  assistant:                    # a pinned Codex App thread
    workspace: ~/workspace/assistant
    runtime: codexApp
    session: 00000000-0000-4000-8000-000000000000
    channels: [feishu.assistant, telegram.main]

  researcher:                   # a Claude Desktop session (its start hook runs `fractalbot relay`)
    workspace: ~/workspace/researcher
    runtime: claudeDesktop
    channels: [telegram.main]

  # harness:                    # the active DeepSeek Harness Desktop composer
  #   workspace: ~/workspace/harness
  #   runtime: deepseekHarness
  #   channels: [telegram.main]

  # builder:                    # a tmux agent run by agent-manager
  #   workspace: ~/workspace/builder
  #   runtime: agentManager
  #   session: main

# ── Schedules: when to wake which agent ─────────────────────
# The gateway appends the commands for reporting the outcome and for
# lowering or restoring the frequency; prompts describe only the task.
# backoff lists the lower-frequency levels an agent may switch to when idle.
schedules:
  maxConcurrent: 2
  jobs:
    assistant-heartbeat:
      agent: assistant
      cron: "0 * * * *"
      backoff: {idle: "0 */3 * * *", deep-idle: "0 9 * * *"}
      resetOnInbound: true      # a message to this agent restores hourly runs
      prompt: |
        Read HEARTBEAT.md and follow it.
        If nothing needs attention, reply HEARTBEAT_OK.

    researcher-morning-report:
      agent: researcher
      cron: "30 7 * * *"
      promptFile: tasks/morning-report.md   # relative to the workspace, read on every run
